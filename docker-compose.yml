version: '3.8'

services:
  # Base de donnees PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: oumi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oumi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/schema-complete.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds/seed-wilayas-complete.sql:/docker-entrypoint-initdb.d/02-wilayas.sql
    networks:
      - oumi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oumi-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/oumi_db
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oumi-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  oumi-network:
    driver: bridge
